name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Definir versão
        id: ver
        shell: bash
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Preparar Visual Studio
        id: vs
        continue-on-error: true
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar (MSVC)
        id: msvc
        if: steps.vs.outcome == 'success'
        continue-on-error: true
        shell: cmd
        run: build_msvc.bat ${{ steps.ver.outputs.version }}

      - name: Verificar build MSVC
        id: check
        shell: bash
        run: |
          if [ -f PrecisionFix.exe ]; then echo "built=true" >> "$GITHUB_OUTPUT"; else echo "built=false" >> "$GITHUB_OUTPUT"; fi

      - uses: msys2/setup-msys2@v2
        if: steps.check.outputs.built != 'true'
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compilar (MinGW)
        if: steps.check.outputs.built != 'true'
        shell: msys2 {0}
        run: bash ./build.sh "${{ steps.ver.outputs.version }}"

      - name: Notas da versão
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMPILER: ${{ steps.check.outputs.built == 'true' && 'MSVC (Visual Studio)' || 'MinGW-w64' }}
        run: |
          if [ ! -f PrecisionFix.exe ]; then echo "::error::Nenhum compilador gerou o PrecisionFix.exe"; exit 1; fi
          SHA=$(sha256sum PrecisionFix.exe | cut -d' ' -f1)
          {
            echo "## O que mudou"
            echo ""
            echo "${COMMIT_MSG:-Atualização manual}"
            echo ""
            echo "## Download"
            echo "Baixe o **PrecisionFix.exe** abaixo e execute como administrador."
            echo "Quem já tem o app recebe esta versão **automaticamente** ao abrir."
            echo ""
            echo "## Verificação"
            echo "Compilado pelo GitHub Actions direto do código deste repositório ($COMPILER)."
            echo ""
            echo "SHA256: \`$SHA\`"
          } > notes.md
          cat notes.md

      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release create "$TAG" PrecisionFix.exe \
            --repo "${{ github.repository }}" \
            --title "Precision Fix $TAG" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            --latest
